plugins {
	id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
	id 'maven-publish'
	id 'org.spongepowered.mixin' version '0.7.38'
	//id 'net.minecraftforge.gradle' version '6.0.+'
	id 'com.diffplug.spotless' version '6.25.0'
}

spotless {
	java {
		removeUnusedImports()

		googleJavaFormat('1.17.0')

		// eclipse().configFile('eclipse-format.xml')

		trimTrailingWhitespace()
		endWithNewline()

		// target 'src/main/java/**/*.java'
	}
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
	mappings channel: 'official', version: project.minecraft_version

	copyIdeResources = true

	runs {
		client {
			workingDirectory project.file('run')

			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'
			property 'mixin.env.remapRefMap', 'true'
			property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"

			mods {
				continuity {
					source sourceSets.main
				}
			}
		}
	}
}

repositories {
	mavenCentral()
	maven { url = "https://jitpack.io" }
}

dependencies {
	minecraft "net.minecraftforge:forge:${project.forge_version}"

	implementation "io.github.llamalad7:mixinextras-forge:0.4.1"

	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
	annotationProcessor "io.github.llamalad7:mixinextras-common:0.4.1"

	compileOnly "io.github.llamalad7:mixinextras-common:0.4.1"
	//compileOnly files("F:/Game/Minecraft/Mymodpack/libraries/io/github/llamalad7/mixinextras-common/0.4.1/mixinextras-common-0.4.1.jar")
	//annotationProcessor files("F:/Game/Minecraft/Mymodpack/libraries/io/github/llamalad7/mixinextras-common/0.4.1/mixinextras-common-0.4.1.jar")
}

tasks.withType(JavaCompile).configureEach {
	dependsOn 'createSrgToMcp'
}

mixin {
	add sourceSets.main, 'continuity.mixins.refmap.json'
	config 'continuity.mixins.json'
}

processResources {
	inputs.property 'version', project.version

	filesMatching('META-INF/mods.toml') {
		expand 'version': project.version
	}
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}

	manifest {
		attributes([
				"Specification-Title"     : "continuity",
				"Specification-Vendor"    : "PepperBell",
				"Specification-Version"   : "1",
				"Implementation-Title"    : project.name,
				"Implementation-Vendor"   : "PepperBell",
				"Implementation-Version"  : project.jar.archiveVersion,
				"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
				"MixinConfigs"            : "continuity.mixins.json"
		])
	}
}

// configure the maven publication
publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
