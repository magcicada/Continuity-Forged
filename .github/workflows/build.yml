name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "1.20.1/dev" ]
  pull_request:
    branches: [ "1.20.1/dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 1.20.1/dev branch
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-excludes: |
            caches/forge_gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Spotless
        run: ./gradlew :spotlessApply

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Continuity-Build
          path: build/libs/
